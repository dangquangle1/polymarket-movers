name: project-polymarket-movers

# Runs only when what Terraform deploys changes. Listing paths (rather than
# excluding docs) keeps docs-only PRs and bootstrap/ changes from running a full
# plan and then waiting on the production approval gate to apply nothing.
# "*.tf" matches the repo root only, so bootstrap/ is not included.
on:
  pull_request:
    paths:
      - "*.tf"
      - "src/**"
      - ".github/workflows/_terraform.yml"
      - ".github/workflows/project-polymarket-movers.yml"
  push:
    branches: [main]
    paths:
      - "*.tf"
      - "src/**"
      - ".github/workflows/_terraform.yml"
      - ".github/workflows/project-polymarket-movers.yml"

# The caller must grant the permissions the reusable workflow needs so it can
# pass them down (OIDC token + the PR plan comment).
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    uses: ./.github/workflows/_terraform.yml
    with:
      working_directory: .
      environment: production
    secrets: inherit
